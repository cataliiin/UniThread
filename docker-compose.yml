# ==============================================================================
# UniThread - Multi-Container Docker Orchestration
# ==============================================================================

name: unithread

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: unithread-db
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-unithread}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - unithread-network
    healthcheck:
      # Native utility to assert database accessibility
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. MinIO Object Storage Service
  # ----------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: unithread-minio
    restart: unless-stopped
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - ./data/minio:/data
    networks:
      - unithread-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. FastAPI Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unithread-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Pass through PostgreSQL connection details matching Postgres service credentials
      # To switch FastAPI to PostgreSQL, make sure backend/.env has DATABASE_URL set accordingly
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-unithread}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadminpassword}
    volumes:
      - ./backend:/app
      # Prevent host virtual environment from conflicting inside container
      - /app/venv
    networks:
      - unithread-network
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # FastAPI-level health status check
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4. SvelteKit Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unithread-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      # Prevent host node_modules from overwriting container libraries
      - /app/node_modules
      - /app/.svelte-kit
    networks:
      - unithread-network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Wget is built-in to alpine and validates Vite/SvelteKit status safely
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 5. Nginx Reverse Proxy Service (Production Profile Only)
  # ----------------------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: unithread-nginx
    restart: unless-stopped
    profiles:
      - production
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - unithread-network
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3

# ------------------------------------------------------------------------------
# Bridge Network & Persistent Volumes Definitions
# ------------------------------------------------------------------------------
networks:
  unithread-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
