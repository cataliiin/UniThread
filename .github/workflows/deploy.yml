name: Deploy to DigitalOcean

on:
  push:
    branches:
      - production  # Triggers automatically when code is pushed or merged to the production branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy to DigitalOcean Droplet via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
          BACKEND_PROD_ENV: ${{ secrets.BACKEND_PROD_ENV }}
          FRONTEND_PROD_ENV: ${{ secrets.FRONTEND_PROD_ENV }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USERNAME }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          envs: PROD_ENV, BACKEND_PROD_ENV, FRONTEND_PROD_ENV
          script: |
            # Ensure the deployment directory exists
            if [ ! -d "/var/www/unithread" ]; then
              mkdir -p /var/www
              git clone https://github.com/${{ github.repository }}.git /var/www/unithread
            fi
            
            cd /var/www/unithread
            
            # Reset any local changes and pull the latest code from the production branch
            git fetch --all
            git reset --hard origin/production
            
            # Securely inject production environment configurations from GitHub Secrets
            echo "$PROD_ENV" > .env
            echo "$BACKEND_PROD_ENV" > backend/.env
            echo "$FRONTEND_PROD_ENV" > frontend/.env
            
            # Stop any running production services to ensure clean port releases
            docker compose --profile production down
            
            # Rebuild and launch the entire production stack in background daemon mode
            docker compose --profile production up -d --build
            
            # Prune unused docker assets to prevent disk bloat on the Droplet
            docker image prune -f
